name: Versions

on:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '>=18'
      - run: node scripts/check-version-bumps.mjs "origin/$BASE_REF"
        env:
          BASE_REF: ${{ github.base_ref }}
